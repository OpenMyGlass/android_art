# SPDX-License-Identifier: Apache-2.0
# OpenMyGlass: checks for the glass-4.4 branch of art. The full build (with the ART-only checks)
# runs from OpenMyGlass/manifest. ART's own host tests need a full AOSP host build and do not
# run here.
name: check
on:
  push:
    branches: [glass-4.4]
  pull_request:
permissions:
  contents: read
env:
  # android-4.4.4_r2.0.1 plus android-security's zygote descriptor fix (branch aosp-4.4).
  BASE: 479fe13d929012cd45c7a92ce140dae0b71e026f
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Unit tests
        run: python3 -m unittest discover -s tools/glass -v
      - name: Fetch AOSP platform/art (commits only, blobs on demand)
        run: |
          git remote add aosp https://android.googlesource.com/platform/art
          git fetch --filter=blob:none --no-tags aosp \
            +refs/heads/lollipop-release:refs/remotes/aosp/lollipop-release
      - name: Every commit on top of the base is a recorded backport or our own tooling
        run: python3 tools/glass/check_backports.py "$BASE" HEAD aosp/lollipop-release
